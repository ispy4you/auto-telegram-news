name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Russian or English — whichever you're comfortable with.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Uvicorn/application logs around the time of the issue. Please redact secrets (API keys, tokens, session paths with personal info).
      render: shell
  - type: input
    id: version
    attributes:
      label: Commit / version
      description: Output of `git rev-parse --short HEAD`
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options:
        - macOS (local dev)
        - Ubuntu/Debian (VPS)
        - Docker
        - Other
    validations:
      required: true
  - type: dropdown
    id: db
    attributes:
      label: Database
      options:
        - PostgreSQL
        - SQLite
    validations:
      required: true
