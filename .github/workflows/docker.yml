name: Docker build

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-compose.yml
      - requirements.txt
      - .dockerignore
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - docker-compose.yml
      - requirements.txt
      - .dockerignore
      - .github/workflows/docker.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
