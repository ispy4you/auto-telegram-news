<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Ошибка {{ code }}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml"/>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #f5f6fa; color: #1a1d23;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      max-width: 34rem; margin: 1rem; padding: 2rem;
      background: #fff; border-radius: .75rem; box-shadow: 0 1px 3px rgba(26, 29, 35, .12);
    }
    h1 { margin: 0 0 .75rem; font-size: 1.35rem; }
    code { padding: .15rem .4rem; background: #eef0f5; border-radius: .25rem; font-size: 1.05rem; }
    p { line-height: 1.5; }
    a { color: #1a1d23; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Что-то сломалось на нашей стороне</h1>
    <p>Код этой ошибки — <code>{{ code }}</code>. Она целиком записана в журнал
      вместе с тем, какое действие её вызвало.</p>
    <p>Посмотреть: <a href="/logs">журнал панели</a> — ищите запись
      «Ошибка сервера». Если нужна помощь, назовите этот код.</p>
    <p><a href="/">Вернуться на дашборд</a></p>
  </div>
</body>
</html>
