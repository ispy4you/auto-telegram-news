<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ title or "TG News MVP" }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f5f6fa; }
    #sidebar {
      width: 220px; min-height: 100vh; background: #1a1d23;
      position: fixed; top: 0; left: 0; z-index: 100;
      display: flex; flex-direction: column;
    }
    #sidebar .brand {
      padding: 1.2rem 1.2rem 1rem;
      font-size: 1.05rem; font-weight: 700; color: #fff;
      border-bottom: 1px solid #2d3139;
      letter-spacing: .02em;
    }
    #sidebar .nav-link {
      color: #a0a6b1; padding: .55rem 1.2rem;
      display: flex; align-items: center; gap: .6rem;
      font-size: .9rem; border-radius: 0;
      transition: background .15s, color .15s;
    }
    #sidebar .nav-link:hover, #sidebar .nav-link.active {
      background: #2d3139; color: #fff;
    }
    #sidebar .nav-link .bi { font-size: 1rem; flex-shrink: 0; }
    #sidebar .badge { font-size: .68rem; padding: .2em .45em; margin-left: auto; }
    #sidebar .section-label {
      font-size: .68rem; text-transform: uppercase; letter-spacing: .08em;
      color: #555b6a; padding: 1rem 1.2rem .3rem; font-weight: 600;
    }
    #main { margin-left: 220px; padding: 1.8rem 2rem; min-height: 100vh; }
    @media (max-width: 768px) {
      #sidebar { width: 100%; min-height: auto; position: relative; }
      #main { margin-left: 0; padding: 1rem; }
    }
  </style>
</head>
<body>

<div id="sidebar">
  <div class="brand"><i class="bi bi-broadcast me-2 text-primary"></i>TG News</div>

  {# Project switcher #}
  <div class="dropdown px-2 py-2" style="border-bottom:1px solid #2d3139">
    <button class="btn btn-sm w-100 text-start d-flex align-items-center justify-content-between"
      style="background:#2d3139;color:#e0e3ea;border:none;font-size:.82rem"
      data-bs-toggle="dropdown">
      <span class="text-truncate me-1">
        <i class="bi bi-folder2-open me-1 text-primary"></i>
        {{ current_project.name if current_project else '— проект —' }}
      </span>
      <i class="bi bi-chevron-down" style="font-size:.65rem;flex-shrink:0"></i>
    </button>
    <ul class="dropdown-menu dropdown-menu-dark w-100" style="min-width:0;font-size:.85rem">
      {% for p in all_projects %}
      <li>
        <form method="post" action="/switch-project" class="m-0">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <input type="hidden" name="project_id" value="{{ p.id }}">
          <button type="submit" class="dropdown-item d-flex align-items-center gap-2
            {% if current_project and p.id == current_project.id %}active{% endif %}">
            {% if current_project and p.id == current_project.id %}
              <i class="bi bi-check2" style="font-size:.8rem"></i>
            {% else %}
              <span style="width:.9rem"></span>
            {% endif %}
            {{ p.name }}
          </button>
        </form>
      </li>
      {% endfor %}
      <li><hr class="dropdown-divider"></li>
      <li><a href="/projects" class="dropdown-item"><i class="bi bi-gear me-1"></i>Управление</a></li>
    </ul>
  </div>

  <nav class="nav flex-column pt-1">
    <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">
      <i class="bi bi-speedometer2"></i> Дашборд
    </a>

    <div class="section-label">Контент</div>
    <a class="nav-link {% if request.url.path.startswith('/posts') %}active{% endif %}" href="/posts">
      <i class="bi bi-inbox"></i> Посты
      {% if nav_new %}<span class="badge bg-primary rounded-pill">{{ nav_new }}</span>{% endif %}
    </a>
    <a class="nav-link {% if request.url.path.startswith('/compose') %}active{% endif %}" href="/compose">
      <i class="bi bi-magic"></i> Генерация
    </a>

    <div class="section-label">Каналы</div>
    <a class="nav-link {% if request.url.path.startswith('/sources') %}active{% endif %}" href="/sources">
      <i class="bi bi-telegram"></i> Источники
    </a>
    <a class="nav-link {% if request.url.path.startswith('/targets') %}active{% endif %}" href="/targets">
      <i class="bi bi-send"></i> Публикация
    </a>
    <a class="nav-link {% if request.url.path.startswith('/routes') %}active{% endif %}" href="/routes">
      <i class="bi bi-diagram-3"></i> Маршруты
    </a>

    <div class="section-label">Система</div>
    <a class="nav-link {% if request.url.path.startswith('/projects') %}active{% endif %}" href="/projects">
      <i class="bi bi-folder2"></i> Проекты
    </a>
    <a class="nav-link {% if request.url.path.startswith('/stats') %}active{% endif %}" href="/stats">
      <i class="bi bi-bar-chart-line"></i> Статистика
    </a>
    <a class="nav-link {% if request.url.path.startswith('/settings') %}active{% endif %}" href="/settings">
      <i class="bi bi-sliders"></i> Настройки
    </a>
    <a class="nav-link {% if request.url.path.startswith('/logs') %}active{% endif %}" href="/logs">
      <i class="bi bi-journal-text"></i> Логи
    </a>
  </nav>

  <div style="margin-top:auto;border-top:1px solid #2d3139;padding:.9rem 1.2rem">
    <div style="font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:#555b6a;font-weight:600;margin-bottom:.4rem">Автосбор</div>
    <div id="sched-status" style="color:#a0a6b1;font-size:.82rem;line-height:1.5">
      <div id="sched-line">
        <span id="sched-icon" class="me-1">⏱</span><span id="sched-label">—</span>
      </div>
      <div id="sched-bar-wrap" style="margin-top:.35rem;height:3px;background:#2d3139;border-radius:2px;display:none">
        <div id="sched-bar" style="height:3px;background:#0d6efd;border-radius:2px;width:0%;transition:width .9s linear"></div>
      </div>
    </div>
  </div>
</div>

<div id="main">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function () {
  const label = document.getElementById('sched-label');
  const icon = document.getElementById('sched-icon');
  const barWrap = document.getElementById('sched-bar-wrap');
  const bar = document.getElementById('sched-bar');
  if (!label) return;

  let intervalSec = 120, nextRunAt = null, isRunning = false;

  function fmt(sec) {
    if (sec <= 0) return 'сейчас…';
    const m = Math.floor(sec / 60), s = sec % 60;
    return m > 0 ? `${m}м ${s}с` : `${s}с`;
  }

  function tick() {
    if (isRunning) {
      icon.textContent = '🔄';
      label.textContent = 'Идёт сбор…';
      bar.style.width = '100%';
      return;
    }
    if (!nextRunAt) { label.textContent = '—'; return; }
    const secsLeft = Math.round((nextRunAt - Date.now()) / 1000);
    label.textContent = 'Следующий: ' + fmt(secsLeft);
    icon.textContent = secsLeft <= 10 ? '⚡' : '⏱';
    const pct = Math.max(0, Math.min(100, 100 - (secsLeft / intervalSec * 100)));
    bar.style.width = pct + '%';
  }

  async function poll() {
    try {
      const r = await fetch('/api/scheduler-status');
      if (!r.ok) return;
      const d = await r.json();
      intervalSec = d.interval_seconds || 120;
      isRunning = d.is_running || false;
      nextRunAt = d.next_run_at ? new Date(d.next_run_at).getTime() : null;
      barWrap.style.display = 'block';
    } catch (_) {}
  }

  poll();
  setInterval(tick, 1000);
  setInterval(poll, 10000);
})();
</script>
</body>
</html>
